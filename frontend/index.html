<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HueLight</title>
<!-- GEÇİCİ sayfa: Frontend aşamasında baştan tasarlanacak (docs/00-proje-plani.md, Kararlar). -->
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a5; --accent:#ffb547; --ok:#3ddc97; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI", system-ui, sans-serif; padding:24px 16px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 16px; }
  .dev { display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .dot { width:34px; height:34px; border-radius:50%; flex:none; border:2px solid var(--line); }
  .muted { color:var(--muted); font-size:13px; }
  button { margin-left:auto; background:var(--accent); color:#1a1200; border:none; border-radius:10px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button.off { background:var(--panel-2); color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:default; }
  button.del { margin-left:0; background:none; color:var(--muted); border:1px solid var(--line); }
  button.del:hover { color:#ff5d5d; border-color:#ff5d5d; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>HueLight</h1>
  <div id="list"><p class="muted">Yükleniyor…</p></div>
  <p class="muted"><a href="/kurulum">Yeni ampul kur</a> · <a href="/docs">API</a></p>
</main>
<script>
const devices = new Map();

function kelvinColor(k) { return k < 3000 ? "#ffb46b" : k < 4500 ? "#ffe2bf" : "#f4f7ff"; }

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  if (!devices.size) { list.innerHTML = '<p class="muted">Ampul yok. <a href="/kurulum">Kurulum</a> ile ekle.</p>'; return; }
  for (const d of devices.values()) {
    const row = document.createElement("div"); row.className = "dev";
    const dot = document.createElement("span"); dot.className = "dot";
    dot.style.background = d.power && d.online ? (d.mode === "ct" ? kelvinColor(d.kelvin) : d.hex) : "#333";
    const info = document.createElement("div");
    const name = document.createElement("div"); name.textContent = d.name;
    const meta = document.createElement("div"); meta.className = "muted";
    meta.textContent = `${d.ip} · ${d.online ? (d.power ? `açık · %${d.brightness}` : "kapalı") : "ulaşılamıyor"}`;
    info.append(name, meta);
    const btn = document.createElement("button");
    btn.textContent = d.power ? "Kapat" : "Aç"; btn.className = d.power ? "off" : ""; btn.disabled = !d.online;
    btn.onclick = () => fetch(`/api/devices/${encodeURIComponent(d.id)}/power`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on: !d.power }) });
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "Sil"; del.title = "Listeden kaldır";
    del.onclick = async () => {
      // Sıfırlanmış/kaldırılmış ampuller listede "ulaşılamıyor" olarak kalır; kullanıcı kaldırabilsin.
      if (!confirm(`"${d.name}" listeden kaldırılsın mı? Ampul sıfırlanmadıysa ağda bulununca listeye geri gelir.`)) return;
      await fetch(`/api/devices/${encodeURIComponent(d.id)}`, { method: "DELETE" });
    };
    row.append(dot, info, btn, del);
    list.append(row);
  }
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "snapshot") { devices.clear(); msg.devices.forEach(d => devices.set(d.id, d)); }
    else if (msg.type === "device") devices.set(msg.device.id, msg.device);
    else if (msg.type === "removed") devices.delete(msg.id);
    render();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
